name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "desktop/docs/**"
      - "desktop/marketing/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "desktop/docs/**"
      - "desktop/marketing/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python 单测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 装依赖
        run: pip install pillow
      - name: 跑测试
        run: PYTHONPATH=. python3 -m unittest discover -s tests -p 'test_*.py'

  desktop:
    name: 桌面端构建与单测
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - name: 装前端依赖
        run: npm ci
        working-directory: desktop
      - name: 类型检查与打包
        run: npm run build
        working-directory: desktop
      - name: Rust 单测
        run: cargo test
        working-directory: desktop/src-tauri
