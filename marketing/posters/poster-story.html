<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0}
body{width:1600px;height:900px;overflow:hidden;background:#0b0a0c;color:#fff;
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;position:relative}
.photo{position:absolute;right:0;top:0;width:760px;height:900px;
  background-image:linear-gradient(90deg,rgba(11,10,12,.98) 0%,rgba(11,10,12,.4) 40%,rgba(11,10,12,.15) 100%),url('/Users/leng/lifelog-minicpm/marketing/shots/02-sheet.png');
  background-size:cover;background-position:center;filter:brightness(.85)}
.photo::after{content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,#0b0a0c 0%,rgba(11,10,12,.25) 45%,transparent)}
.quote{position:absolute;left:100px;top:100px;width:660px}
.qmark{font-size:130px;color:#c9a45a;font-family:Georgia,serif;line-height:.6;margin-left:-12px}
blockquote{font-family:"Songti SC","Noto Serif SC",Georgia,serif;font-size:30px;line-height:2.05;
  color:#e8e4f0;font-weight:400;margin-top:20px}
.sig{margin-top:40px;font-size:15px;color:#c9a45a;letter-spacing:.1em}
.brand{position:absolute;left:100px;bottom:70px;font-size:14px;letter-spacing:.3em;color:#6b6674}
.top{position:absolute;left:100px;top:52px;font-size:15px;letter-spacing:.4em;color:#c9a45a}
</style></head><body>
<p class="top">它读懂了这十年</p>
<div class="quote">
<p class="qmark">“</p>
<blockquote>2026 年 9 月 26 日，一个小女孩坐在装饰有兔子玩偶的户外场景里，表情很平静。<br><br>
那是你这一年唯一一次带她出门。上一次，是 2024 年。<br><br>
你拍过 437 张湖边，357 张海边，几乎都在下午四点的光线里。<br>
你的相册里，82% 的画面只有你自己。</blockquote>
<p class="sig">—— 拾光 LifeLog 写给相册主人的一段话</p>
</div>
