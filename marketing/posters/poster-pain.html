<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0}
body{width:1600px;height:900px;overflow:hidden;background:#0b0a0c;color:#fff;
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  display:flex;align-items:center;position:relative}
.bg{position:absolute;inset:0;opacity:.35;
  background-image:url('/Users/leng/lifelog-minicpm/marketing/shots/02-sheet.png');
  background-size:cover;background-position:center;filter:grayscale(.6) brightness(.4)}
.bg::after{content:"";position:absolute;inset:0;
  background:linear-gradient(100deg,#0b0a0c 30%,rgba(11,10,12,.72) 60%,rgba(11,10,12,.45))}
.tag{position:absolute;left:100px;top:80px;font-size:15px;letter-spacing:.4em;color:#c9a45a}
h1{position:relative;font-size:88px;line-height:1.14;font-weight:800;letter-spacing:.01em;
  max-width:19ch;margin-left:100px}
h1 .num{color:#c9a45a;font-family:"Schibsted Grotesk",sans-serif}
.sub{position:relative;margin-left:100px;margin-top:44px;font-size:22px;line-height:2;
  color:#b8b2c6;max-width:44ch}
.stat{position:absolute;right:110px;bottom:90px;text-align:right}
.stat b{display:block;font-size:64px;font-weight:800;color:#c9a45a;
  font-family:"Schibsted Grotesk",sans-serif}
.stat span{font-size:16px;color:#8f8a84;letter-spacing:.2em}
.brand{position:absolute;left:100px;bottom:80px;font-size:14px;letter-spacing:.3em;color:#6b6674}
</style></head><body>
<div class="bg"></div>
<p class="tag">十 · 年 · 相 · 册</p>
<h1>用了 10 年小米手机，<br>攒下 <span class="num">29294</span> 张照片、<br>几百个 G 的回忆。<br>然后，再也不敢翻。</h1>
<p class="sub">不是不想回忆，是翻不动：重复的照片、找不到的那一张、<br>
记不清是哪年的哪次旅行。删吧，怕删掉真的重要；<br>不删吧，它就一直在那里，越来越沉。</p>
<div class="stat"><b>29294</b><span>张照片 · 6 年</span></div>
<p class="brand">拾光 LifeLog</p>
</body></html>
