<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>人生回顾 · 拾光 LifeLog</title>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#06070b; --bg-2:#0b0d14; --ink:#f3f4fa; --ink-2:#c8cddf; --muted:#8b93ad;
  --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.16);
  --a1:#6d8cff; --a2:#b583ff; --warm:#e3b179;
  --serif:"Songti SC","Noto Serif SC","Source Han Serif SC",Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
  --gutter:clamp(20px,6vw,92px);
  --measure:1120px;
}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;overflow-x:hidden;line-height:1.6}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(1100px 620px at 78% -8%,rgba(109,140,255,.16),transparent 62%),
    radial-gradient(860px 560px at 6% 104%,rgba(181,131,255,.12),transparent 62%)}
body::after{content:"";position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.32;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='.42'/></svg>");
  mix-blend-mode:soft-light}
::selection{background:rgba(109,140,255,.34);color:#fff}
img{display:block}
a{color:inherit;text-decoration:none}
.scrollbar::-webkit-scrollbar{height:6px;width:6px}
.scrollbar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:3px}

/* ---------- 顶栏 ---------- */
#progress{position:fixed;left:0;top:0;height:2px;width:0;z-index:90;
  background:linear-gradient(90deg,var(--a1),var(--a2));box-shadow:0 0 14px rgba(109,140,255,.7)}
.topbar{position:fixed;top:0;left:0;right:0;z-index:70;display:flex;align-items:center;gap:22px;
  padding:13px var(--gutter);background:rgba(6,7,11,.72);backdrop-filter:blur(18px) saturate(140%);
  border-bottom:1px solid var(--line)}
.brand{font-family:var(--serif);font-size:16px;letter-spacing:.24em;color:var(--ink);
  display:flex;align-items:center;gap:11px;white-space:nowrap}
.brand i{width:5px;height:5px;border-radius:50%;background:linear-gradient(120deg,var(--a1),var(--a2));
  display:block;box-shadow:0 0 10px rgba(109,140,255,.9)}
.seg{display:flex;gap:2px;padding:3px;border-radius:999px;background:rgba(255,255,255,.055);
  border:1px solid var(--line);flex:0 0 auto}
.seg button{border:0;background:transparent;color:var(--muted);font-size:12.5px;cursor:pointer;
  padding:7px 15px;border-radius:999px;transition:.3s cubic-bezier(.2,.7,.2,1);font-family:var(--sans);
  white-space:nowrap;letter-spacing:.02em}
.seg button:hover{color:var(--ink)}
.seg button.on{background:linear-gradient(120deg,var(--a1),var(--a2));color:#fff;
  box-shadow:0 4px 18px rgba(109,140,255,.4)}
.chips{display:flex;gap:7px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:rgba(255,255,255,.045);color:var(--muted);
  padding:6px 14px;border-radius:999px;font-size:12.5px;cursor:pointer;white-space:nowrap;
  transition:.25s;font-family:var(--sans)}
.chip:hover{color:var(--ink);border-color:var(--line-2);background:rgba(255,255,255,.08)}
.chip.on{background:var(--ink);color:#0a0b11;border-color:transparent}
.ghost{background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--ink);
  padding:8px 16px;border-radius:999px;font-size:12.5px;cursor:pointer;white-space:nowrap;
  transition:.25s;font-family:var(--sans)}
.ghost:hover{background:rgba(255,255,255,.12);border-color:var(--line-2)}

/* ---------- 封面 ---------- */
.hero{position:relative;min-height:100svh;display:flex;flex-direction:column;justify-content:flex-end;
  padding:96px var(--gutter) 42px;overflow:hidden}
.hero-bg{position:absolute;inset:-3%;background-size:cover;background-position:center;
  filter:saturate(.9) brightness(.5) contrast(1.05);transform:scale(1.05);
  animation:drift 30s cubic-bezier(.4,0,.2,1) infinite alternate}
.hero-bg::after{content:"";position:absolute;inset:0;
  background:
    linear-gradient(180deg,rgba(6,7,11,.86) 0%,rgba(6,7,11,.28) 38%,rgba(6,7,11,.97) 96%),
    radial-gradient(120% 80% at 20% 100%,rgba(6,7,11,.85),transparent 60%)}
@keyframes drift{from{transform:scale(1.05) translate3d(0,0,0)}to{transform:scale(1.12) translate3d(-1.2%,-1.2%,0)}}
.hero-inner{position:relative;z-index:2;max-width:var(--measure);width:100%}
.hero .eyebrow{display:flex;align-items:center;gap:14px;font-size:11.5px;letter-spacing:.3em;
  color:var(--muted);text-transform:uppercase}
.hero .eyebrow b{color:var(--a1);font-weight:600;letter-spacing:.2em}
.hero h1{font-family:var(--serif);font-size:clamp(58px,10vw,140px);line-height:.94;margin:22px 0 26px;
  font-weight:600;letter-spacing:.02em;
  background:linear-gradient(104deg,#ffffff 12%,#cfd8ff 52%,#e9d4ff 92%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.hero .lede{max-width:62ch;font-family:var(--serif);font-size:17px;line-height:2.05;color:#d6dbec;
  white-space:pre-wrap;margin:0 0 34px}
.hero-meta{display:flex;flex-wrap:wrap;gap:0;border-top:1px solid var(--line);padding-top:20px}
.hero-meta div{padding:0 30px;border-left:1px solid var(--line);min-width:120px}
.hero-meta div:first-child{padding-left:0;border-left:0}
.hero-meta b{display:block;font-family:var(--serif);font-size:26px;font-weight:500;letter-spacing:.01em}
.hero-meta span{display:block;margin-top:5px;font-size:11px;letter-spacing:.2em;color:var(--muted)}
.scroll-hint{position:absolute;right:var(--gutter);bottom:46px;z-index:2;font-size:11px;
  letter-spacing:.24em;color:var(--muted);display:flex;align-items:center;gap:10px}
.scroll-hint:after{content:"";width:38px;height:1px;background:linear-gradient(90deg,var(--muted),transparent);
  animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.4;transform:scaleX(.7)}50%{opacity:1;transform:scaleX(1)}}

/* ---------- 通用章节 ---------- */
.wrap{position:relative;z-index:2;max-width:var(--measure);margin:0 auto;padding:0 var(--gutter)}
section.band{padding:clamp(80px,12vh,150px) 0}
.kicker{display:flex;align-items:center;gap:16px;font-size:11px;letter-spacing:.3em;
  text-transform:uppercase;color:var(--muted)}
.kicker .idx{font-family:var(--serif);font-size:12px;letter-spacing:.14em;color:var(--a1);
  border:1px solid rgba(109,140,255,.4);border-radius:999px;padding:3px 10px}
.kicker .line{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
h2.title{font-family:var(--serif);font-size:clamp(30px,4.4vw,54px);line-height:1.2;margin:22px 0 14px;
  font-weight:600;letter-spacing:.02em}
.lead{color:var(--muted);font-size:15px;line-height:1.95;max-width:60ch;margin:0 0 34px}

/* ---------- 叙事 ---------- */
.story-shell{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:60px;align-items:start}
.story-prose{font-family:var(--serif);font-size:18px;line-height:2.15;color:#dfe3f0;white-space:pre-wrap;
  margin:0;letter-spacing:.01em}
.story-prose::first-letter{font-size:1.5em;line-height:1;color:var(--warm)}
.story-side{position:sticky;top:96px;border-left:1px solid var(--line);padding-left:26px}
.story-side .q{font-family:var(--serif);font-size:14.5px;line-height:1.95;color:var(--muted)}
.story-side .q b{display:block;color:var(--ink);font-size:12px;letter-spacing:.22em;
  font-weight:500;margin-bottom:12px}
.story-side .meta{margin-top:26px;padding-top:18px;border-top:1px solid var(--line);
  font-size:11.5px;letter-spacing:.14em;color:var(--muted);line-height:2}

/* ---------- 画像 ---------- */
.insight-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.icard{position:relative;background:linear-gradient(160deg,rgba(255,255,255,.055),rgba(255,255,255,.018));
  border:1px solid var(--line);border-radius:20px;padding:30px 30px 32px;overflow:hidden;
  transition:transform .5s cubic-bezier(.2,.7,.2,1),border-color .4s,background .4s}
.icard:hover{transform:translateY(-4px);border-color:rgba(109,140,255,.42);
  background:linear-gradient(160deg,rgba(109,140,255,.12),rgba(255,255,255,.02))}
.icard .no{position:absolute;right:22px;top:16px;font-family:var(--serif);font-size:44px;
  color:rgba(255,255,255,.055);letter-spacing:-.02em}
.icard h3{font-family:var(--serif);font-size:21px;margin:0 0 14px;font-weight:600;letter-spacing:.02em;
  display:flex;align-items:center;gap:11px}
.icard h3:before{content:"";width:7px;height:7px;border-radius:50%;flex:0 0 auto;
  background:linear-gradient(120deg,var(--a1),var(--a2));box-shadow:0 0 10px rgba(109,140,255,.8)}
.icard p{margin:0;font-size:14.5px;line-height:2.1;color:#c4cadf}
.icard .mark{color:var(--warm);font-weight:600}

/* ---------- 证据 ---------- */
.pills{display:flex;flex-wrap:wrap;gap:9px;margin:0 0 30px}
.pill{font-size:12.5px;color:#ccd3e8;background:rgba(255,255,255,.05);
  border:1px solid var(--line);border-radius:999px;padding:7px 15px;letter-spacing:.01em}
.pill b{color:#fff;font-weight:600}
.pill.warm{border-color:rgba(227,177,121,.4);color:#f0d9b6;background:rgba(227,177,121,.08)}
.proofs{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:14px}
.proof{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:16px;overflow:hidden;
  transition:transform .45s cubic-bezier(.2,.7,.2,1),border-color .35s}
.proof:hover{transform:translateY(-4px);border-color:var(--line-2)}
.proof img{width:100%;height:158px;object-fit:cover;background:#12141c;transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.proof:hover img{transform:scale(1.05)}
.proof .tx{padding:13px 15px 16px}
.proof .dt{font-size:11px;color:var(--a1);letter-spacing:.12em}
.proof .cp{font-size:12.5px;line-height:1.85;color:#b9c0d6;margin-top:7px}

/* ---------- 能力带 ---------- */
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:14px}
.flow div{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:16px;
  padding:20px 20px 22px;position:relative;overflow:hidden;transition:.4s}
.flow div:hover{border-color:rgba(181,131,255,.4);background:rgba(181,131,255,.07)}
.flow b{display:block;font-family:var(--serif);font-size:26px;margin-bottom:8px;color:#fff;letter-spacing:.01em}
.flow span{font-size:12.5px;color:var(--muted);line-height:1.85}

/* ---------- 时间线 ---------- */
.years{margin-top:20px}
.year{margin:0 0 8px}
.year-head{display:flex;align-items:baseline;gap:20px;padding:34px 0 22px;border-top:1px solid var(--line)}
.year-head h2{font-family:var(--serif);font-size:clamp(40px,6vw,78px);margin:0;font-weight:500;
  letter-spacing:.02em;line-height:1;
  background:linear-gradient(100deg,#fff,#a9b9ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.year-head em{font-style:normal;font-size:11.5px;letter-spacing:.24em;color:var(--muted)}
.year-head .cnt{margin-left:auto;font-size:11.5px;letter-spacing:.2em;color:var(--muted)}
.events{position:relative;padding-left:34px}
.events:before{content:"";position:absolute;left:6px;top:8px;bottom:8px;width:1px;
  background:linear-gradient(180deg,rgba(109,140,255,.55),rgba(255,255,255,.04))}
.evt{position:relative;display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr);
  gap:44px;padding:34px 0 46px;opacity:1;transform:none}
.js .evt{opacity:0;transform:translateY(24px);
  transition:opacity .85s cubic-bezier(.2,.7,.2,1),transform .85s cubic-bezier(.2,.7,.2,1)}
.js .evt.in{opacity:1;transform:none}
.evt:before{content:"";position:absolute;left:-31px;top:44px;width:9px;height:9px;border-radius:50%;
  background:var(--bg);border:2px solid var(--a1);box-shadow:0 0 0 4px rgba(109,140,255,.12)}
.evt .when{font-size:11.5px;letter-spacing:.2em;color:var(--a1)}
.evt h3{font-family:var(--serif);font-size:25px;margin:12px 0 14px;font-weight:600;line-height:1.35}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
.tag{font-size:11px;color:#c3cbea;background:rgba(109,140,255,.13);
  border:1px solid rgba(109,140,255,.26);padding:3px 10px;border-radius:999px;letter-spacing:.02em}
.evt .sum{font-size:13.5px;line-height:2.05;color:#aeb5cb;margin:0}
.evt .count{margin-top:16px;font-size:11px;letter-spacing:.18em;color:var(--muted)}
.mosaic{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:106px;gap:10px}
.mosaic figure{margin:0;position:relative;overflow:hidden;border-radius:14px;cursor:zoom-in;
  background:#12141c;transition:.45s cubic-bezier(.2,.7,.2,1)}
.mosaic figure.big{grid-column:span 2;grid-row:span 2}
.mosaic figure:nth-child(1){grid-column:span 2;grid-row:span 2}
.mosaic img{width:100%;height:100%;object-fit:cover;transition:transform .85s cubic-bezier(.2,.7,.2,1)}
.mosaic figure:hover{transform:translateY(-3px)}
.mosaic figure:hover img{transform:scale(1.07)}
.mosaic figcaption{position:absolute;inset:auto 0 0 0;padding:30px 13px 11px;font-size:11.5px;
  color:#e9ecf7;background:linear-gradient(transparent,rgba(5,6,9,.9));opacity:0;transition:.4s;line-height:1.6}
.mosaic figure:hover figcaption{opacity:1}

/* ---------- 灯箱 ---------- */
.lightbox{position:fixed;inset:0;z-index:95;background:rgba(4,5,8,.97);display:none;
  flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:54px 0 16px;
  backdrop-filter:blur(10px)}
.lightbox.on{display:flex}
.lb-img{max-width:min(1220px,92vw);max-height:62vh;object-fit:contain;border-radius:6px;
  box-shadow:0 40px 120px rgba(0,0,0,.7);animation:pop .4s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.lb-info{width:min(1220px,92vw);display:flex;justify-content:space-between;align-items:flex-start;gap:40px;
  border-top:1px solid var(--line);padding-top:16px}
.lb-left{flex:1;min-width:0}
.lb-right{flex:0 0 auto;text-align:right;max-width:34%}
.lb-date{font-size:11.5px;letter-spacing:.22em;color:var(--a1);margin-bottom:8px}
.lb-cap{font-family:var(--serif);font-size:19px;line-height:1.8;color:#eff1fa}
.lb-meta{font-size:12.5px;color:var(--muted);line-height:2.1}
.lb-close{position:absolute;top:20px;right:26px;width:40px;height:40px;border-radius:50%;
  border:1px solid var(--line);background:rgba(255,255,255,.06);color:#fff;font-size:17px;cursor:pointer;
  transition:.25s}
.lb-close:hover{background:rgba(255,255,255,.16)}
.lb-arrow{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;
  border:1px solid var(--line);background:rgba(255,255,255,.06);color:#fff;font-size:20px;cursor:pointer;
  transition:.25s;z-index:2}
.lb-arrow:hover{background:rgba(255,255,255,.16)}
.lb-prev{left:22px}.lb-next{right:22px}
.lb-hint{font-size:11px;color:var(--muted);letter-spacing:.16em}
.film{width:min(1220px,92vw);display:flex;gap:7px;padding:6px 0 8px;overflow-x:auto;scrollbar-width:none}
.film::-webkit-scrollbar{display:none}
.film img{height:56px;border-radius:7px;opacity:.3;cursor:pointer;transition:.3s;flex:0 0 auto}
.film img:hover{opacity:.7}
.film img.on{opacity:1;outline:2px solid var(--a1);outline-offset:-2px}

/* ---------- 页脚 ---------- */
footer{position:relative;z-index:2;margin-top:90px;border-top:1px solid var(--line);
  padding:44px var(--gutter) 70px;color:var(--muted);font-size:12.5px;line-height:2}
footer .fr{max-width:var(--measure);margin:0 auto;display:flex;flex-wrap:wrap;gap:20px;
  justify-content:space-between;align-items:flex-start}
footer b{color:var(--ink);font-weight:500}

@media (max-width:980px){
  .story-shell{grid-template-columns:1fr;gap:34px}
  .story-side{position:static;border-left:0;border-top:1px solid var(--line);padding:20px 0 0}
  .insight-grid{grid-template-columns:1fr}
  .evt{grid-template-columns:1fr;gap:22px}
  .events{padding-left:24px}
  .evt:before{left:-21px}
  .mosaic{grid-auto-rows:92px}
  .lb-info{flex-direction:column;gap:12px}
  .lb-right{text-align:left;max-width:100%}
  .lb-img{max-height:48vh}
  .topbar{gap:14px;padding:11px 18px}
  .hero-meta div{padding:0 18px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}
}
</style>
</head>
