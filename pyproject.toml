[project]
name = "lifelog-minicpm"
version = "0.1.0"
description = "本地相册 → MiniCPM 识别 → 生活档案 → AI 可查"
requires-python = ">=3.11"
dependencies = ["pillow>=10", "pillow-heif>=0.16"]

[project.scripts]
lifelog = "lifelog.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["lifelog"]
